<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vania & Fitra</title>

<!-- Open Graph -->
<meta property="og:title" content="Vania & Fitra">
<meta property="og:image"
content="https://guest.pleasurein.my.id/vania-fitra/og-cover.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1080">
<meta property="og:image:height" content="1350">
<meta property="og:url"
content="https://guest.pleasurein.my.id/vania-fitra">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image"
content="https://guest.pleasurein.my.id/vania-fitra/og-cover.jpg">


<style>

/* =========================
   FONT
========================= */

	@font-face {
	  font-family: 'Providence Sans';
	  src: url('Providence Sans Offc W00 Rg.ttf') format('truetype');
	  font-weight: normal;
	  font-style: normal;
}


/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}


/* =========================
   COVER
========================= */

.cover{
  position:fixed;
  inset:0;

  background:
    url('cover.jpg')
    center center / cover
    no-repeat;

  width:100%;
  height:100%;
}


/* =========================
   DEAR + GUEST
========================= */

.guest-area{
  position:absolute;

  /* POSISI HORIZONTAL */
  left:50%;
  transform:translateX(-50%);

  /* POSISI VERTIKAL */
  top:38%;

  width:80%;

  text-align:center;

  color:#fff4a3;

  font-family:
    'FF Providence Sans',
    sans-serif;

  z-index:5;
}


.dear{
  font-size:clamp(16px, 4.5vw, 28px);

  letter-spacing:0px;

  line-height:1;

  margin-bottom:2px;

  color:#fff4a3;
  font-family: 'Providence Sans', sans-serif;
}


.guest{
  font-size:clamp(16px, 5vw, 28px);

  line-height:1.1;

  color:#fff4a3;
  font-family: 'Providence Sans', sans-serif;

  word-break:break-word;

  padding:0 8px;
}


/* =========================
   TAP TO OPEN
========================= */

.open-area{
  position:absolute;

  left:49%;
  transform:translateX(-50%);

  /*
    POSISI SESUAI
    AREA TAP TO OPEN
  */
  top:60%;

  z-index:10;

  text-align:center;
}


.open-btn{
  border:none;

  background:transparent;

  padding:0;

  color:#fff4a3;

  font-family: 'Providence Sans', sans-serif;

  font-size:clamp(16px, 5vw, 28px);

  cursor:pointer;

  letter-spacing:1px;

  -webkit-tap-highlight-color:transparent;
}


.open-btn:active{
  transform:scale(.96);
}


/* =========================
   FADE OUT
========================= */

.cover{
  transition:
    opacity .6s ease,
    visibility .6s ease;
}

.cover.hide{
  opacity:0;
  visibility:hidden;
}


/* =========================
   MUSIC BUTTON
========================= */

.music-btn{
  position:fixed;

  bottom:20px;
  right:20px;

  width:42px;
  height:42px;

  border-radius:50%;

  background:rgba(255,255,255,.9);

  display:none;

  align-items:center;
  justify-content:center;

  cursor:pointer;

  z-index:100;
}

.music-btn img{
  width:20px;
  height:20px;
}

</style>

</head>


<body>


<!-- =========================
     COVER
========================= -->

<div class="cover" id="cover">


  <!-- DEAR + NAMA TAMU -->

  <div class="guest-area">

    <div class="dear">
      Dear,
    </div>

    <div
      class="guest"
      id="guestName">

      Guest Name

    </div>

  </div>


  <!-- TAP TO OPEN -->

  <div class="open-area">

    <button
      class="open-btn"
      id="openBtn">

      Tap to open

    </button>

  </div>


</div>



<!-- =========================
     MUSIC
========================= -->

<audio
  id="music"
  loop
  preload="auto">

  <source
    src="music.mp3"
    type="audio/mpeg">

</audio>


<!-- MUSIC CONTROL -->

<div
  class="music-btn"
  id="musicBtn">

  <img
    id="musicIcon"
    src="https://cdn-icons-png.flaticon.com/512/727/727245.png"
    alt="Music">

</div>



<script>


/* =========================
   AMBIL NAMA TAMU
   ?to=Nama+Tamu
========================= */

const params = new URLSearchParams(
  window.location.search
);

const guest = params.get("to");


if(guest){

  document.getElementById(
    "guestName"
  ).textContent = guest;

}



/* =========================
   MUSIC
========================= */

const music =
  document.getElementById("music");

const musicBtn =
  document.getElementById("musicBtn");

const musicIcon =
  document.getElementById("musicIcon");


let isPlaying = false;


function playMusic(){

  music.play()
    .then(() => {

      isPlaying = true;

      musicBtn.style.display = "flex";

    })
    .catch(error => {

      console.log(
        "Music tidak bisa diputar:",
        error
      );

    });

}



/* =========================
   MUSIC BUTTON
========================= */

musicBtn.addEventListener(
  "click",
  () => {

    if(isPlaying){

      music.pause();

      musicIcon.src =
        "https://cdn-icons-png.flaticon.com/512/727/727240.png";

      isPlaying = false;

    }else{

      music.play();

      musicIcon.src =
        "https://cdn-icons-png.flaticon.com/512/727/727245.png";

      isPlaying = true;

    }

  }
);




/* =========================
   TAP TO OPEN
========================= */

document.getElementById("openBtn").addEventListener("click", () => {

    // PLAY MUSIC
    playMusic();

    // FADE COVER
    document.getElementById("cover").classList.add("hide");

    // OPEN INVITATION IN NEW TAB
    const invitationURL =
        "https://pleasurein.my.id/vania-fitra"
        + window.location.search;

    window.open(invitationURL, "_blank");

});



</script>


</body>
</html>
